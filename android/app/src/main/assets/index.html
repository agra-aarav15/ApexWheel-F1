<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, orientation=landscape">
    <title>ApexWheel F1 - Real Virtual Racing Wheel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="racepad-active">

    <!-- Top Status Bar (Gyropad Style) -->
    <header id="gp-header">
        <div class="gp-brand">
            <span class="gp-mark">🏎️</span>
            <span class="gp-title">APEXWHEEL <b class="gp-f1-tag">F1</b></span>
        </div>
        <div class="gp-center-status" id="gp-top-status">
            <span class="gp-dot" id="gp-dot"></span>
            <span id="gp-status-text">F1 25 WAITING (PORT 20777)</span>
        </div>
        <div class="gp-actions">
            <a href="apexwheel.apk" download class="gp-chip-btn" id="btn-apk">📲 APK</a>
            <button class="gp-chip-btn" id="btn-calibrate">🎯 CENTER</button>
            <button class="gp-chip-btn" id="btn-fullscreen">⛶</button>
        </div>
    </header>

    <!-- Main Screen Stage -->
    <main id="gp-stage">

        <!-- ==================== RACEPAD F1 VIEW ==================== -->
        <div id="view-racepad" class="gp-view active">

            <!-- Top Row Function Pills (Pill Geometry) -->
            <div class="gp-top-row">
                <div class="gp-pill-group left">
                    <button class="gp-pill btn-ers" id="btn-ers">
                        <span class="gp-pill-txt">ERS</span>
                        <span class="gp-pill-sub">OT</span>
                    </button>
                    <button class="gp-pill btn-pit" id="btn-pit">
                        <span class="gp-pill-txt">PIT</span>
                        <span class="gp-pill-sub">LIMIT</span>
                    </button>
                </div>

                <div class="gp-pill-group center">
                    <div class="gp-pill telem-pill" id="telem-pill">
                        <span id="pill-gear-disp">N</span>
                        <span id="pill-speed-disp">0 KM/H</span>
                        <span id="pill-drs-badge" class="drs-badge">DRS</span>
                    </div>
                </div>

                <div class="gp-pill-group right">
                    <button class="gp-pill btn-gear-down" id="paddle-down">
                        <span class="gp-pill-txt">GEAR ▼</span>
                    </button>
                    <button class="gp-pill btn-gear-up" id="paddle-up">
                        <span class="gp-pill-txt">GEAR ▲</span>
                    </button>
                </div>
            </div>

            <!-- Middle Section: Pedals & Center Steering Arc -->
            <div class="gp-mid-row">
                <!-- Left Pedals: Brake & Clutch -->
                <div class="gp-pedal-cluster left-cluster">
                    <div class="gp-pedal clutch-pedal" id="pedal-clutch">
                        <div class="pedal-fill clutch-fill" id="fill-clutch"></div>
                        <span class="pedal-name">CLUTCH</span>
                    </div>
                    <div class="gp-pedal brake-pedal" id="pedal-brake">
                        <div class="pedal-fill brake-fill" id="fill-brake"></div>
                        <span class="pedal-name">BRAKE</span>
                    </div>
                </div>

                <!-- Center Steering Arc & F1 Cockpit -->
                <div class="gp-center-cluster">
                    <!-- F1 Rev Lights (Shift LEDs) -->
                    <div class="f1-rev-bar" id="f1-rev-bar">
                        <span class="r-led green"></span>
                        <span class="r-led green"></span>
                        <span class="r-led green"></span>
                        <span class="r-led green"></span>
                        <span class="r-led green"></span>
                        <span class="r-led red"></span>
                        <span class="r-led red"></span>
                        <span class="r-led red"></span>
                        <span class="r-led red"></span>
                        <span class="r-led red"></span>
                        <span class="r-led blue"></span>
                        <span class="r-led blue"></span>
                        <span class="r-led blue"></span>
                        <span class="r-led blue"></span>
                        <span class="r-led blue"></span>
                    </div>

                    <!-- Steering Wheel Arc Canvas / Vector -->
                    <div class="steering-arc-container">
                        <svg class="steering-svg" viewBox="0 0 300 160">
                            <!-- Outer track arc -->
                            <path class="arc-track" d="M 30,140 A 120,120 0 0,1 270,140" />
                            <!-- Active steering needle -->
                            <line class="arc-needle" id="arc-needle" x1="150" y1="140" x2="150" y2="20" />
                        </svg>
                        <!-- Center LCD Readout -->
                        <div class="arc-center-readout">
                            <span class="arc-gear" id="arc-gear">N</span>
                            <span class="arc-speed" id="arc-speed">0 <small>KM/H</small></span>
                            <span class="arc-steer-deg" id="arc-deg">0°</span>
                        </div>
                    </div>

                    <!-- Central Switcher Button (Gyropad Racepad Switcher) -->
                    <button class="gp-mode-pill" id="gp-mode-toggle">
                        <span class="mode-pill-txt">F1 RACEPAD</span>
                    </button>
                </div>

                <!-- Right Pedal: Throttle / Speed -->
                <div class="gp-pedal-cluster right-cluster">
                    <div class="gp-pedal throttle-pedal" id="pedal-throttle">
                        <div class="pedal-fill throttle-fill" id="fill-throttle"></div>
                        <span class="pedal-name">SPEED</span>
                    </div>
                </div>
            </div>

            <!-- Bottom Row: D-Pad, Function Buttons, Face Buttons -->
            <div class="gp-bottom-row">
                <!-- Left: D-Pad -->
                <div class="gp-dpad">
                    <button class="dpad-btn up" id="btn-dup">▲</button>
                    <button class="dpad-btn left" id="btn-dleft">◀</button>
                    <button class="dpad-btn down" id="btn-ddown">▼</button>
                    <button class="dpad-btn right" id="btn-dright">▶</button>
                </div>

                <!-- Center F1 Quick Adjustment Buttons -->
                <div class="gp-f1-actions">
                    <button class="action-btn" id="btn-bb-minus">BB -</button>
                    <button class="action-btn" id="btn-bb-plus">BB +</button>
                    <button class="action-btn" id="btn-diff-minus">DIFF -</button>
                    <button class="action-btn" id="btn-diff-plus">DIFF +</button>
                    <button class="action-btn" id="btn-radio">RADIO</button>
                    <button class="action-btn" id="btn-lock">🔒 LOCK</button>
                </div>

                <!-- Right: Face Buttons -->
                <div class="gp-face-buttons">
                    <button class="face-btn btn-y" id="btn-y">Y<small>DRS</small></button>
                    <button class="face-btn btn-x" id="btn-x">X</button>
                    <button class="face-btn btn-a" id="btn-a">A</button>
                    <button class="face-btn btn-b" id="btn-b">B<small>ERS</small></button>
                </div>
            </div>

        </div>

        <!-- ==================== GAMEPAD TRADITIONAL VIEW ==================== -->
        <div id="view-gamepad" class="gp-view">
            <div class="traditional-gamepad">
                <div class="gp-col left">
                    <div class="shoulder-btn" id="gp-lb">LB</div>
                    <div class="trigger-btn" id="gp-lt">LT</div>
                    <div class="joystick-base" id="stick-left">
                        <div class="joystick-knob" id="knob-left"></div>
                    </div>
                </div>
                <div class="gp-col mid">
                    <button class="gp-mode-pill" id="gp-gamepad-toggle">GAMEPAD MODE</button>
                    <div class="gp-menu-btns">
                        <button class="menu-btn" id="gp-back">BACK</button>
                        <button class="menu-btn" id="gp-start">START</button>
                    </div>
                </div>
                <div class="gp-col right">
                    <div class="shoulder-btn" id="gp-rb">RB</div>
                    <div class="trigger-btn" id="gp-rt">RT</div>
                    <div class="joystick-base" id="stick-right">
                        <div class="joystick-knob" id="knob-right"></div>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <script src="app.js"></script>
</body>
</html>
