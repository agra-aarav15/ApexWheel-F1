plugins {
    id 'com.android.application'
}

android {
    namespace 'com.apexwheel.f1'
    compileSdk 34

    defaultConfig {
        applicationId "com.apexwheel.f1"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Zero heavy external dependencies needed - uses native Android WebView, SensorManager, Vibrator, and Sockets!
}
